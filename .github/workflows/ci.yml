name: ci

# Regenerates the definitions from the pinned zigbee-herdsman-converters,
# checks that the committed output matches, validates them against the zdef
# JSON Schema (the hub's when it exists), compiles them and builds the
# (unsigned) catalog: banks, shards, manifest. Never signs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: npm ci
      - name: Golden tests
        run: npm test
      - name: Regenerate from the pinned zigbee-herdsman-converters
        run: |
          npm run generate
          if ! git diff --quiet -- definitions/generated coverage || [ -n "$(git status --porcelain -- definitions/generated)" ]; then
            git status --short -- definitions/generated coverage | head -50
            echo "::error::definitions/generated or coverage/ differ from the generator output; run 'npm run generate' and commit"
            exit 1
          fi
      - name: Schema
        run: |
          tools/fetch-hub-schema.sh
          python3 tools/validate.py
      - name: Rust zdefc (optional, repository variable ZDEFC_GIT_REF)
        if: vars.ZDEFC_GIT_REF != ''
        run: cargo install --locked --git https://github.com/faronov/zigbee-rs-hub --rev "${{ vars.ZDEFC_GIT_REF }}" zdefc
      - name: Catalog (unsigned)
        run: |
          python3 tools/catalog/build.py --out out ${{ vars.ZDEFC_GIT_REF != '' && '--compare' || '' }}
          python3 tools/catalog/test_catalog.py out
          cat out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-unsigned
          path: |
            out/REPORT.md
            out/report.json
            out/manifest.cbor
            out/bank-*.zdb
          retention-days: 14
