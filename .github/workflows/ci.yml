name: ci

# Regenerates the definitions from the pinned zigbee-herdsman-converters,
# checks that the committed output matches, validates them against the hub's
# zdef JSON Schema, compiles them with the Rust zdefc of faronov/zigbee-rs-hub
# (repository variable ZDEFC_GIT_REF, a hub commit) and builds the unsigned
# catalog: banks, shards, manifest. The catalog test signs a copy with a
# throwaway key; the real key is only used by the release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: npm ci
      - name: Golden tests
        run: npm test
      - name: Regenerate from the pinned zigbee-herdsman-converters
        run: |
          npm run generate
          if ! git diff --quiet -- definitions/generated coverage || [ -n "$(git status --porcelain -- definitions/generated)" ]; then
            git status --short -- definitions/generated coverage | head -50
            git diff --word-diff=porcelain -- definitions/generated coverage | grep -E '^[-+][^-+]' | head -40 | cut -c1-400
            echo "::error::definitions/generated or coverage/ differ from the generator output; run 'npm run generate' and commit"
            exit 1
          fi
      - name: zdefc version
        run: |
          if [ -z "${{ vars.ZDEFC_GIT_REF }}" ]; then
            echo "::error::set the repository variable ZDEFC_GIT_REF to a faronov/zigbee-rs-hub commit"
            exit 1
          fi
      - name: Cache zdefc
        id: zdefc-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/zdefc
          key: zdefc-${{ runner.os }}-${{ vars.ZDEFC_GIT_REF }}
      - name: Install zdefc
        if: steps.zdefc-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/faronov/zigbee-rs-hub --rev "${{ vars.ZDEFC_GIT_REF }}" zdefc
      - name: Schema
        env:
          HUB_SCHEMA_REF: ${{ vars.ZDEFC_GIT_REF }}
        run: |
          tools/fetch-hub-schema.sh
          python3 tools/validate.py
      - name: Catalog (unsigned) and end-to-end test
        run: |
          python3 tools/catalog/build.py --out out
          python3 tools/catalog/test_catalog.py out
          cat out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-unsigned
          path: |
            out/REPORT.md
            out/report.json
            out/catalog.json
            out/manifest.cbor
            out/bank-*.zdb
          retention-days: 14
