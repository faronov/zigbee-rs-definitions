name: release

# Builds the catalog from the committed definitions with the Rust zdefc
# (repository variable ZDEFC_GIT_REF), signs the bank headers and the
# manifest with the Ed25519 key in the secret ZDEF_SIGNING_KEY (PKCS#8 PEM,
# `zdefc catalog sign`), verifies the result against the public key the hub
# firmware embeds (keys/zdef-catalog-ed25519.pub.pem) and publishes a GitHub
# Release "catalog-YYYY.MM.DD[.n]" with the manifest, the 256 shards and the
# two banks (docs/catalog-format.md). Without the secret the release is a
# pre-release without manifest.cose, so releases/latest/download/... never
# serves an unsigned catalog.
on:
  workflow_dispatch:
    inputs:
      refresh_popularity:
        description: Refresh the issue-mention popularity (about 500 GitHub API requests on a cold cache)
        type: boolean
        default: false
      force:
        description: Release even if the content equals the latest release
        type: boolean
        default: false
      dry_run:
        description: Build and sign, but do not publish
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: npm ci
      - run: npm test
      - name: Regenerate and check
        run: |
          npm run generate
          git diff --quiet -- definitions/generated coverage || { echo "::error::committed definitions are stale; run npm run generate"; exit 1; }
      - name: zdefc version
        run: |
          if [ -z "${{ vars.ZDEFC_GIT_REF }}" ]; then
            echo "::error::set the repository variable ZDEFC_GIT_REF to a faronov/zigbee-rs-hub commit"
            exit 1
          fi
      - name: Cache zdefc
        id: zdefc-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/zdefc
          key: zdefc-${{ runner.os }}-${{ vars.ZDEFC_GIT_REF }}
      - name: Install zdefc
        if: steps.zdefc-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/faronov/zigbee-rs-hub --rev "${{ vars.ZDEFC_GIT_REF }}" zdefc
      - name: Schema
        env:
          HUB_SCHEMA_REF: ${{ vars.ZDEFC_GIT_REF }}
        run: |
          tools/fetch-hub-schema.sh
          python3 tools/validate.py
      - name: Popularity cache
        if: inputs.refresh_popularity
        uses: actions/cache@v4
        with:
          path: .cache/issues
          key: issues-${{ github.run_id }}
          restore-keys: issues-
      - name: Refresh popularity
        if: inputs.refresh_popularity
        run: python3 tools/popularity.py --cache .cache/issues
      - name: Version
        id: version
        run: |
          day="$(date -u +%Y.%m.%d)"
          serial=0
          tag="catalog-${day}"
          while gh release view "$tag" >/dev/null 2>&1; do
            serial=$((serial + 1))
            tag="catalog-${day}.${serial}"
          done
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          python3 tools/catalog/build.py --out out --date "${{ steps.version.outputs.day }}" --serial "${{ steps.version.outputs.serial }}"
          python3 tools/catalog/test_catalog.py out
      - name: Anything new?
        id: changed
        run: |
          changed=true
          if [ "${{ inputs.force }}" != "true" ] && gh release download --pattern catalog.json --dir prev >/dev/null 2>&1; then
            # same definitions (content digest) and same bank membership = nothing to release
            changed="$(python3 -c 'import json; a=json.load(open("prev/catalog.json")); b=json.load(open("out/catalog.json")); f=lambda c: (c["content"], [(x["name"], x["included"]) for x in c["banks"]]); print(str(f(a)!=f(b)).lower())')"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          [ "$changed" = true ] || echo "::notice::catalog content equals the latest release; nothing to publish"
      - name: Sign
        if: steps.changed.outputs.changed == 'true'
        id: sign
        env:
          ZDEF_SIGNING_KEY: ${{ secrets.ZDEF_SIGNING_KEY }}
        run: |
          if [ -z "$ZDEF_SIGNING_KEY" ]; then
            echo "::warning::no ZDEF_SIGNING_KEY secret: publishing an unsigned pre-release"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # the secret is an Ed25519 PKCS#8 PEM (openssl genpkey -algorithm ed25519); zdefc reads it from the environment
          zdefc catalog sign out
          zdefc bank pubkey > out/signing-key.txt
          # the key must be the one the hub firmware trusts
          zdefc catalog verify out --pubkey keys/zdef-catalog-ed25519.pub.pem
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.changed.outputs.changed == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          {
            echo "Catalog built from zigbee-herdsman-converters $(node -p 'require("./package.json").dependencies["zigbee-herdsman-converters"]') at ${GITHUB_SHA}."
            echo
            if [ "${{ steps.sign.outputs.signed }}" = true ]; then
              echo "Signed: manifest.cose, key ID $(sed -n 's/^kid //p' out/signing-key.txt)."
            else
              echo "**Unsigned pre-release** (no ZDEF_SIGNING_KEY secret): hubs will not install it."
            fi
            echo
            cat out/REPORT.md
          } > notes.md
          assets=(out/manifest.cbor out/shard-*.cbor out/bank-*.zdb out/REPORT.md out/catalog.json)
          [ -f out/manifest.cose ] && assets+=(out/manifest.cose)
          [ "${#assets[@]}" -le 1000 ] || { echo "::error::${#assets[@]} assets exceed the GitHub limit"; exit 1; }
          if [ "${{ inputs.dry_run }}" = true ]; then
            echo "dry run: would publish $tag with ${#assets[@]} assets (signed: ${{ steps.sign.outputs.signed }})" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          flags=(--title "$tag" --notes-file notes.md --target "$GITHUB_SHA")
          if [ "${{ steps.sign.outputs.signed }}" = true ]; then flags+=(--latest); else flags+=(--prerelease --latest=false); fi
          gh release create "$tag" "${flags[@]}" "${assets[@]}"
          echo "published $tag with ${#assets[@]} assets" >> "$GITHUB_STEP_SUMMARY"
