# Catalog build configuration (tools/catalog/build.py).
#
# Bank budgets follow docs/device-support.md 16.1/16.2 of faronov/zigbee-rs-hub
# (D3, D10, D20): 4 MB boards 2 x 256 KiB, 8 MB boards 2 x 576 KiB; local
# definition areas 64 / 128 KiB. Banks hold fully translated definitions only
# (D12), ordered by popularity (D18).
banks:
  4m: {size: 262144}
  8m: {size: 589824}
local:
  4m: 65536
  8m: 131072
# Vendor templates (C tier) the released hub firmware implements. Definitions
# that need a template not listed here are not put into banks (a hub without
# the template would skip them, spec 8.5); they are still in the shards.
# Add a name here when the hub release that implements it is out. The family
# templates `tuya` and `lumi` are listed by helper (`<name>.<helper>`, the
# features of `params.features`): a definition is bank-eligible when every
# helper it uses is listed (the hub checks their arguments and exposes too).
templates_available:
  # zigbee-rs-hub 0.4 (#95)
  - tuya_metering_zero_debounce
  # faronov/zigbee-rs-hub #114 (after 0.4.1)
  - tuya.tuya_on_off
  - tuya.operation_mode
  - tuya.multi_action
  - tuya.switch_scene
  - tuya.tuya_led_indicator
  - tuya.relay_din_led_indicator
  - tuya.electricity_measurement_poll
  # faronov/zigbee-rs-hub #115
  - lumi.lumi_basic
  - lumi.lumi_specific
  - lumi.lumi_electricity_meter
  - lumi.lumi_prevent_reset
  - lumi.lumi_prevent_leave
  - lumi.lumi_set_event_mode
  - lumi.lumi_temperature
